<section id="hero" class="hero-section">
  <div class="hero-card card-elevated">
    <div class="hero-inner">
      <div class="hero-avatar">
        <img src="assets/profile-photo.png" alt="Dhivya G" class="avatar-image" />
      </div>
      <div class="hero-content">
        <h1 class="hero-title">Dhivya G</h1>
        <p class="hero-subtitle">Software Engineer · LLM &amp; Automation · Salesforce · Data &amp; Cloud</p>
        <div class="hero-meta">
          <a [href]="'mailto:' + email" class="meta-link" aria-label="Email">{{ email }}</a>
          <span class="meta-sep">·</span>
          <a [href]="'tel:+91' + phone" class="meta-link" aria-label="Phone">+91 {{ phone }}</a>
        </div>
        <div class="hero-links">
          <a [href]="linkedin" target="_blank" rel="noopener noreferrer" class="link-pill">
            <span>LinkedIn</span>
          </a>
          <a [href]="github" target="_blank" rel="noopener noreferrer" class="link-pill">
            <span>GitHub</span>
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
