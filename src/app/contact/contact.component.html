<section id="contact" class="section-block contact-section">
  <div class="contact-card card-elevated">
    <p class="contact-lead">Prefer email for opportunities and collaboration.</p>
    <div class="contact-links">
      <a [href]="'mailto:' + email" class="contact-btn">Email</a>
      <a [href]="'tel:+91' + phone" class="contact-btn">Call</a>
      <a [href]="linkedin" target="_blank" rel="noopener noreferrer" class="contact-btn">LinkedIn</a>
      <a [href]="github" target="_blank" rel="noopener noreferrer" class="contact-btn">GitHub</a>
    </div>
  </div>
</section>
