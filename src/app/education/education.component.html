<section id="education" class="section-block">
  <div class="section-cards">

      <div class="card-header">
        <h3 class="card-title">{{ school }}</h3>
        <span class="card-badge">CGPA {{ cgpa }}</span>
      </div>
      <p class="card-meta">{{ degree }}</p>
      <p class="card-period">{{ period }}</p>
    </div>
  </div>
</section>
